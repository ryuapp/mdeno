name: Report Binary Sizes

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  report:
    name: Report Binary Sizes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download PR number artifact
        uses: actions/download-artifact@v6
        with:
          name: pr-number
          path: pr-number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download all size artifacts
        uses: actions/download-artifact@v6
        with:
          path: all-sizes
          pattern: binary-sizes-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Collect and report sizes
        run: |
          echo "## Binary Sizes" > sizes_report.md
          echo "" >> sizes_report.md
          echo "| Target | mdeno | mdenort |" >> sizes_report.md
          echo "|--------|-------|---------|" >> sizes_report.md

          # Collect and sort by OS: Linux, Apple, Windows
          for pattern in "linux" "apple" "windows"; do
            for json_file in all-sizes/binary-sizes-*/*.json; do
              if [ -f "$json_file" ]; then
                TARGET=$(jq -r '.target' "$json_file")
                if [[ "$TARGET" == *"$pattern"* ]]; then
                  MDENO=$(jq -r '.mdeno.size // "N/A"' "$json_file")
                  MDENORT=$(jq -r '.mdenort.size // "N/A"' "$json_file")
                  echo "| $TARGET | $MDENO | $MDENORT |" >> sizes_report.md
                fi
              fi
            done
          done

          cat sizes_report.md

      - name: Post comment to PR
        uses: actions/github-script@v8
        with:
          script: |
            const fs = await import('fs');
            const report = fs.default.readFileSync('sizes_report.md', 'utf8');
            const body = '<!-- binary-sizes-report -->\n' + report;

            const prNumber = parseInt(fs.default.readFileSync('pr-number/pr_number', 'utf8').trim());

            const comments = await github.rest.issues.listComments({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const existingComment = comments.data.find(comment =>
              comment.body.includes('<!-- binary-sizes-report -->')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
